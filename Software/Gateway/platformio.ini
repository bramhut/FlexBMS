[platformio]
src_dir = main

[env:flexbms_gateway]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = espidf
# Platform 6.12 otherwise selects OpenOCD 0.11.0 from 2022. Use the newer
# Espressif OpenOCD package for the ESP32-C3 built-in USB-JTAG path.
platform_packages =
    tool-openocd-esp32 @ 2.1200.20230419
monitor_speed = 115200
board_build.flash_mode = dio
board_build.partitions = partitions.csv
upload_port = COM6
monitor_port = COM6
debug_tool = esp-builtin
extra_scripts =
    pre:scripts/build_companion.py
    post:scripts/set_app_upload_offset.py
monitor_filters = 
    direct                     ; Pass-through raw ANSI color codes cleanly
    esp32_exception_decoder    ; Automatically translates register addresses to code lines